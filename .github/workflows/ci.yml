name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GitVersion needs full history

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/NatsAuthCallout.Tests/NatsAuthCallout.Tests.csproj -c Release --no-build

      - name: Integration tests (Testcontainers)
        run: dotnet test tests/NatsAuthCallout.IntegrationTests/NatsAuthCallout.IntegrationTests.csproj -c Release --no-build
