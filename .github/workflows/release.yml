name: release

# Tag-based releases: push a tag like v1.2.3 to cut a release (doc 08 §Container & supply
# chain, matching the mcp-private-library/playmetrics-mcp convention: tag-based CI, no
# auto-deploy). ci.yml (P01) gates every push/PR to main; this workflow only runs on tags.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write     # create the GitHub Release
  packages: write     # push the image to GHCR
  id-token: write     # cosign keyless signing (OIDC) + nuget.org Trusted Publishing

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Integration NuGet packages (AuthCallout.Contracts, AuthCallout.Core, AuthCallout.Identity;
  # see src/Directory.Build.props) to nuget.org via Trusted Publishing: NuGet/login swaps this
  # workflow's GitHub OIDC token for a short-lived API key, so no NuGet API key is stored.
  # One-time setup: a nuget.org Trusted Publishing policy (owner ryandanthony, repo
  # nats-auth-callout-service, workflow release.yml, no environment; scope must allow pushing
  # NEW packages since these IDs don't exist on nuget.org yet; glob AuthCallout.*) plus the
  # NUGET_USER repo variable set to
  # the nuget.org account name. Skipped until NUGET_USER exists, so the image release below
  # never depends on it.
  nuget:
    if: vars.NUGET_USER != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # GitVersion needs full history and tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.6.0'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      - name: Authenticate GitHub Packages (festina-lente-io feed)
        run: >-
          dotnet nuget update source github
          --username "github-actions"
          --password "${{ secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text
          --configfile nuget.config

      # Version passed explicitly (same as the image's VERSION build arg) so every package
      # and its inter-package dependency ranges carry the tag's version exactly.
      - name: Pack
        run: >-
          dotnet pack AuthCallout.slnx -c Release -o artifacts/packages
          -p:Version=${{ steps.gitversion.outputs.semVer }}
          -p:DisableGitVersionTask=true

      - name: NuGet login (nuget.org Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # Pushing the .nupkg also pushes its sibling .snupkg to the nuget.org symbol server.
      - name: Push to nuget.org
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --skip-duplicate

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*

  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # GitVersion needs full history and tags

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          # Match the GitVersion.MsBuild package pinned in Directory.Packages.props (6.6.0).
          # gittools/actions v4 is the major that supports GitVersion 6.x; the older v3 line
          # caps at <6.1.0, so '6.x' floated past its supported range and failed the install.
          versionSpec: '6.6.0'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.gitversion.outputs.majorMinorPatch }}
            type=raw,value=${{ steps.gitversion.outputs.major }}.${{ steps.gitversion.outputs.minor }}
            type=raw,value=${{ steps.gitversion.outputs.semVer }}
            type=sha
            type=raw,value=latest

      # Multi-arch (linux/amd64 + linux/arm64, doc 08), SBOM + SLSA provenance attestations
      # baked into the manifest by buildx itself (--sbom/--provenance), and the digest
      # captured for cosign signing below (a mutable tag must never be what gets signed).
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.gitversion.outputs.majorMinorPatch }}
            INFORMATIONAL_VERSION=${{ steps.gitversion.outputs.informationalVersion }}
          secrets: |
            nuget_github_token=${{ secrets.GITHUB_TOKEN }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless (OIDC) signing via the GitHub Actions workflow identity - no long-lived
      # signing keys. Signs the immutable DIGEST, never a mutable tag (doc 08 §Signing &
      # provenance: "so latest/version tags can move without invalidating the signature").
      - name: Sign image digest
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          cosign sign --yes "$IMAGE"

      # The SBOM/provenance attestations were already attached to the manifest by buildx
      # (sbom/provenance: true above); cosign additionally verifies + re-attests them under
      # the same keyless identity so `cosign verify-attestation` (documented in README below)
      # has something to check without needing to trust the registry's own attestation store.
      - name: Verify signature (fail the release if signing didn't take)
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          cosign verify "$IMAGE" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.gitversion.outputs.majorMinorPatch }}
          generate_release_notes: true
          body: |
            Docker image:

            ```
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.gitversion.outputs.majorMinorPatch }}
            ```

            Digest: `${{ steps.build.outputs.digest }}`

            Signed with cosign (keyless/OIDC). Verify:

            ```
            cosign verify ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
            ```
