name: release

# Release on every green push to the trunk (main). tag == release: a v* tag only ever exists
# together with its GitHub Release, image and NuGet packages.
#
# Trunk-based flow (same model as wraithcairn / mcp-private-library):
#   1. Runs after CI completes successfully on a push to main, so only green commits release.
#   2. GitVersion computes the next version from the latest vX.Y.Z tag + commits (patch bump by
#      default; "+semver: minor" / "+semver: major" in a commit message bumps further).
#   3. Skips when nothing release-relevant changed since the last tag (docs/markdown only), or
#      when the commit is already tagged.
#   4. Builds, pushes and cosign-signs the multi-arch image, and publishes the NuGet packages.
#   5. Last, creates the tag and GitHub Release together, so a failed build never leaves an
#      orphan tag. A failed run is safe to re-run: no tag exists yet, so it recomputes the same
#      version, image tags are overwritten and NuGet pushes use --skip-duplicate.
#
# The pushed tag becomes the version source for the NEXT release. Tags created here with
# GITHUB_TOKEN don't trigger other workflows, so there is no tag-push trigger.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write     # create the tag + GitHub Release
  packages: write     # push the image to GHCR
  id-token: write     # cosign keyless signing (OIDC) + nuget.org Trusted Publishing

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  version:
    # workflow_run fires for every completed CI run on main; only release green pushes. A manual
    # dispatch only releases from main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.gate.outputs.release }}
      sha: ${{ steps.gate.outputs.sha }}
      version: ${{ steps.vars.outputs.version }}
      tag: ${{ steps.vars.outputs.tag }}
      major: ${{ steps.gitversion.outputs.major }}
      minor: ${{ steps.gitversion.outputs.minor }}
      informational: ${{ steps.gitversion.outputs.informationalVersion }}
    steps:
      - name: Checkout (full history for GitVersion)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # Release only commits that aren't tagged yet and that change something beyond docs.
      - name: Release gate
        id: gate
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if git tag --points-at "$SHA" | grep -q '^v'; then
            echo "Commit $SHA is already tagged ($(git tag --points-at "$SHA" | tr '\n' ' ')); nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -n "$LAST" ]; then
            CHANGED="$(git diff --name-only "$LAST" "$SHA" -- . \
              ':(exclude)docs/**' ':(exclude)docs-site/**' ':(exclude)implementation-plan/**' \
              ':(exclude)**/*.md' ':(exclude)*.md' ':(exclude).github/workflows/docs.yml')"
            if [ -z "$CHANGED" ]; then
              echo "Only docs changed since $LAST; nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Install GitVersion
        if: steps.gate.outputs.release == 'true'
        uses: gittools/actions/gitversion/setup@v4
        with:
          # Match the GitVersion.MsBuild package pinned in Directory.Packages.props (6.6.0).
          versionSpec: '6.6.0'

      - name: Determine version
        if: steps.gate.outputs.release == 'true'
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      - name: Export version vars
        if: steps.gate.outputs.release == 'true'
        id: vars
        run: |
          set -euo pipefail
          VERSION="${{ steps.gitversion.outputs.majorMinorPatch }}"
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists on another commit; refusing to release over it."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG from ${{ steps.gate.outputs.sha }}"

  # Integration NuGet packages (AuthCallout.Contracts, AuthCallout.Core, AuthCallout.Identity;
  # see src/Directory.Build.props) to nuget.org via Trusted Publishing: NuGet/login swaps this
  # workflow's GitHub OIDC token for a short-lived API key, so no NuGet API key is stored.
  # One-time setup: a nuget.org Trusted Publishing policy (owner ryandanthony, repo
  # nats-auth-callout-service, workflow release.yml, no environment; scope must allow pushing
  # NEW packages; glob AuthCallout.*) plus the NUGET_USER repo variable set to the nuget.org
  # account name. Skipped until NUGET_USER exists.
  nuget:
    needs: version
    if: needs.version.outputs.release == 'true' && vars.NUGET_USER != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0   # SourceLink/repository metadata

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Authenticate GitHub Packages (festina-lente-io feed)
        run: >-
          dotnet nuget update source github
          --username "github-actions"
          --password "${{ secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text
          --configfile nuget.config

      # Version passed explicitly so every package and its inter-package dependency ranges
      # carry the release version exactly.
      - name: Pack
        run: >-
          dotnet pack AuthCallout.slnx -c Release -o artifacts/packages
          -p:Version=${{ needs.version.outputs.version }}
          -p:DisableGitVersionTask=true

      - name: NuGet login (nuget.org Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # Pushing the .nupkg also pushes its sibling .snupkg to the nuget.org symbol server.
      - name: Push to nuget.org
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --skip-duplicate

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*

  image:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=${{ needs.version.outputs.major }}.${{ needs.version.outputs.minor }}
            type=sha
            type=raw,value=latest

      # Multi-arch (linux/amd64 + linux/arm64, doc 08), SBOM + SLSA provenance attestations
      # baked into the manifest by buildx itself (--sbom/--provenance), and the digest
      # captured for cosign signing below (a mutable tag must never be what gets signed).
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            INFORMATIONAL_VERSION=${{ needs.version.outputs.informational }}
          secrets: |
            nuget_github_token=${{ secrets.GITHUB_TOKEN }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless (OIDC) signing via the GitHub Actions workflow identity - no long-lived
      # signing keys. Signs the immutable DIGEST, never a mutable tag (doc 08 §Signing &
      # provenance: "so latest/version tags can move without invalidating the signature").
      - name: Sign image digest
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          cosign sign --yes "$IMAGE"

      - name: Verify signature (fail the release if signing didn't take)
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          cosign verify "$IMAGE" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

  # Tag + GitHub Release are created together, last, only once the image is published and
  # the NuGet job did not fail (it may be skipped when NUGET_USER is unset).
  release:
    needs: [version, image, nuget]
    if: >-
      always() &&
      needs.version.outputs.release == 'true' &&
      needs.image.result == 'success' &&
      (needs.nuget.result == 'success' || needs.nuget.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ needs.version.outputs.sha }}
          name: ${{ needs.version.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          body: |
            Docker image:

            ```
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.version }}
            ```

            Digest: `${{ needs.image.outputs.digest }}`

            NuGet: `AuthCallout.Contracts`, `AuthCallout.Core`, `AuthCallout.Identity` ${{ needs.version.outputs.version }}

            Signed with cosign (keyless/OIDC). Verify:

            ```
            cosign verify ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.image.outputs.digest }} \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
            ```

            Commit: ${{ needs.version.outputs.sha }}
