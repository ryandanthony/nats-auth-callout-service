{{/*
Installs the AuthApplication CRD (mirrors the canonical deploy/crd/authapplication-crd.yaml
maintained by P11 exactly — keep the two in sync on schema changes), gated by
source.k8s.crds.install so a consumer who manages the CRD separately (e.g. one CRD shared
across multiple releases/namespaces) can opt out. Only relevant when source.kind=k8s.
Rendered as a template (not Helm's native crds/ directory) because crds/ cannot be
conditional.
*/}}
{{- if and (eq .Values.source.kind "k8s") .Values.source.k8s.crds.install -}}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: authapplications.authcallout.ants.zone
  labels:
    {{- include "nats-auth-callout-service.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: nats-auth-callout-service
  annotations:
    "helm.sh/resource-policy": keep
spec:
  group: authcallout.ants.zone
  scope: Namespaced
  names:
    plural: authapplications
    singular: authapplication
    kind: AuthApplication
    shortNames:
      - authapp
      - authapps
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Target Account
          type: string
          jsonPath: .spec.targetAccount
        - name: Accepted
          type: boolean
          jsonPath: .status.accepted
        - name: Reason
          type: string
          jsonPath: .status.reason
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            One application's routing config (ADR 0005, doc 09 §4). spec is the same
            canonical Application shape as the files-source schema
            (schemas/config/application/v1.json), minus schemaVersion/name - the CR's
            metadata.name supplies the application name.
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - targetAccount
                - issuer
                - profiles
              properties:
                targetAccount:
                  type: string
                  minLength: 1
                  description: The NATS account minted users for this application are placed in.
                issuer:
                  type: object
                  required:
                    - authority
                    - jwksCache
                  properties:
                    authority:
                      type: string
                    jwksUri:
                      type: string
                      nullable: true
                    jwksCache:
                      type: string
                    refreshInterval:
                      type: string
                      nullable: true
                    validateAudience:
                      type: boolean
                      default: true
                    audience:
                      type: array
                      items:
                        type: string
                    clockSkew:
                      type: string
                      default: 60s
                    allowedAlgorithms:
                      type: array
                      items:
                        type: string
                        enum:
                          - RS256
                          - RS384
                          - RS512
                          - ES256
                          - ES384
                          - ES512
                          - PS256
                          - PS384
                          - PS512
                match:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: >-
                    A claim-path -> accepted-values predicate map (doc 02 Claim match).
                    Keys are arbitrary claim paths.
                identityPropagation:
                  type: object
                  required:
                    - enabled
                  properties:
                    enabled:
                      type: boolean
                anonymousProfile:
                  type: object
                  properties:
                    publish:
                      type: array
                      items:
                        type: string
                    subscribe:
                      type: array
                      items:
                        type: string
                events:
                  type: object
                  properties:
                    success:
                      type: string
                    failure:
                      type: string
                profiles:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - match
                      - grant
                      - nameClaim
                    properties:
                      name:
                        type: string
                      match:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      grant:
                        type: object
                        properties:
                          publish:
                            type: array
                            items:
                              type: string
                          subscribe:
                            type: array
                            items:
                              type: string
                      nameClaim:
                        type: string
                      autoAddSessionAccess:
                        type: boolean
                        default: false
                      variables:
                        type: array
                        items:
                          type: object
                          required:
                            - name
                            - claim
                          properties:
                            name:
                              type: string
                            claim:
                              type: string
                            required:
                              type: boolean
                              default: false
                            transforms:
                              type: array
                              items:
                                x-kubernetes-preserve-unknown-fields: true
                                description: >-
                                  A bare string (lowercase/uppercase/sanitize/hash/require-safe)
                                  or a single-property object ({replace:{from,to}}, {prefix:...},
                                  {suffix:...}); ADR 0009. Full grammar enforced by
                                  Transform.TryParse at load time, not by this schema.
                      publishTemplates:
                        type: array
                        items:
                          type: string
                      subscribeTemplates:
                        type: array
                        items:
                          type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                accepted:
                  type: boolean
                reason:
                  type: string
                  description: Populated when accepted=false; empty otherwise.
{{- end -}}
