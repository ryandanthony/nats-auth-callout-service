# GitVersion configuration
# Versions are driven by git history and tags (e.g. `v1.2.3`).
# See https://gitversion.net/docs/reference/configuration
mode: ContinuousDelivery
tag-prefix: '[vV]?'
branches:
  main:
    regex: ^master$|^main$
    label: ''
    increment: Patch
  pull-request:
    label: pr
ignore:
  sha: []
