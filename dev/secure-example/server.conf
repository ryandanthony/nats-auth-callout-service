# Secure-by-default server.conf (doc §7.1). Keys are throwaway, generated for
# this example only (.issuer.seed/.service.seed are gitignored).
port: 4233

accounts {
  AUTH: {
    users: [ { nkey: UAGZIXT2VCMLL7T35ZY7VKLLYNXHGJIASBHSPIJDBL2QR5L25F6IAKAG } ]
    jetstream: enabled
  }
  NOTES: {
    # The one deliberate crack in the account wall: the public broadcast feed.
    # Without this export/import, an anon subscriber in ANON can never receive
    # notes.public.> published by the backend in NOTES (accounts isolate fully).
    exports: [ { stream: "notes.public.>" } ]
  }
  TASKS: {
    # Second application account (apps/Task.yaml). Same pattern: empty except
    # for its own public feed export into ANON.
    exports: [ { stream: "tasks.public.>" } ]
  }
  ANON: {
    imports: [
      { stream: { account: NOTES, subject: "notes.public.>" } }
      { stream: { account: TASKS, subject: "tasks.public.>" } }
    ]
    limits: { max_connections: 500, max_subscriptions: 20, max_payload: 16384 }
  }
}

authorization {
  timeout: 3
  auth_callout {
    issuer: "ABD5PHRUXXMOCQ2GA2XKRZKSSC7CPAA3GWXEW7PFQPLOTDPKCIK53SYO"
    account: AUTH
    auth_users: [ "UAGZIXT2VCMLL7T35ZY7VKLLYNXHGJIASBHSPIJDBL2QR5L25F6IAKAG" ]
  }
}
