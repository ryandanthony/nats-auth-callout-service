# NATS server config for AppHost.K8s's auth callout (P15, doc 08 §Local development, CRD
# source). Identical shape to AppHost.Local/nats/server.conf - see that file's own comment
# for why a plain AddContainer + this config replaces Aspire's AddNats helper (its built-in
# --user/--pass args conflict with the `accounts {}` block auth_callout's `account:` field
# requires). Same dev-only throwaway keys as AppHost.Local (public halves only, see
# dev/README.md) - the two loops never run against the same NATS server at once.
accounts {
  AUTH: {
    # Callout's own KV writes (identity-store token/assertion buckets, ADR 0013) go through
    # this connection, so JetStream must be opted in here too.
    jetstream: enabled
    users: [ { nkey: UBSMQROM3HYWT3NULVSSGNQGIVUYCGDVTOKZYIYTQSPVGAHKMF4D3IWY } ]
    # See AppHost.Local/nats/server.conf's identical comment: discovery/keys/token/
    # assertion KV buckets are created via this connection and live in AUTH's own
    # JetStream, not the target accounts a client's minted grant places it in - sharing
    # $JS.API and $KV.> out is what makes a real client's KV reads work (recorded as an
    # M2 design question for Ryan).
    exports: [
      { service: "$JS.API.>" }
      { stream: "$KV.>" }
    ]
  }
  # NOTES/TASKS/ANON deliberately do NOT set jetstream: enabled themselves - see
  # AppHost.Local/nats/server.conf's identical comment: a target account's own local
  # JetStream domain shadows the $JS.API.> import below (a request resolves against the
  # account's own local JetStream if one exists, never reaching AUTH's), which silently
  # breaks every cross-account KV read with "stream not found". These accounts have no
  # JetStream assets of their own, so there is nothing to lose relying entirely on the
  # AUTH import.
  NOTES: {
    imports: [
      { service: { account: AUTH, subject: "$JS.API.>" } }
      { stream: { account: AUTH, subject: "$KV.>" } }
    ]
  }
  TASKS: {
    imports: [
      { service: { account: AUTH, subject: "$JS.API.>" } }
      { stream: { account: AUTH, subject: "$KV.>" } }
    ]
  }
  ANON: {
    imports: [
      { service: { account: AUTH, subject: "$JS.API.>" } }
      { stream: { account: AUTH, subject: "$KV.>" } }
    ]
  }
}

authorization {
  auth_callout {
    issuer: "AA7YGMNUDH3477U77LWTBMYZXKWN2FWLZ5AWAAATYZZNTYC2QZEN6KZA"
    account: AUTH
    auth_users: [ "UBSMQROM3HYWT3NULVSSGNQGIVUYCGDVTOKZYIYTQSPVGAHKMF4D3IWY" ]
  }
}
