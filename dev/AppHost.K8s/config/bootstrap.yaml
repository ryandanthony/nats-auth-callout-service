schemaVersion: 1
# Dev-only bootstrap file for AppHost.K8s (CRD source + external K3s cluster + Keycloak).
# Every seed below is a throwaway NKey generated for this dev loop only (never used
# anywhere else, never rotated into any real deployment) - see dev/README.md for how to
# regenerate them with `nats auth nkey gen`. No real secrets. Deliberately reuses the same
# dev-only seeds as AppHost.Local/config/bootstrap.yaml: the two loops never run against
# the same NATS server at once, and using identical throwaway keys makes it obvious at a
# glance that nothing here is meant to be treated as a real credential.
natsUrl: nats://localhost:4223
issuerSeed:
  kind: inline
  value: SAAM3Y6NLDHLMGVHSSPKDMVTW7KPQ33DFWEMEWWRB76ZVPSRV5UY3L63FA
serviceUserSeed:
  kind: inline
  value: SUADPSPIOAP6ED36NENY4NG2WTS5F5FCWTW6IUM7GONN6PLC5LI65PP62Q
assertionKeys:
  - kid: dev-key-a
    key:
      kind: inline
      value: SAAP54W6I7WDKDQIAJYTJFCOGOENX62L4OA3KPFDAUBBT6HYV3E4GN2NSI
    active: true
source:
  kind: k8s
  # Matches the "owner: dev" label on dev/AppHost.K8s/manifests/samples/{Note,Task}.yaml
  # (ADR 0005 label-selector ownership) - never claims deploy/crd/samples/'s "owner: prod"
  # CRs, even if someone applies those into the same dev cluster by hand.
  labelSelector: authcallout.ants.zone/owner=dev
  warnStaleness: 60s
  maxStaleness: 15m
  reconnectBackoff: 5s
jwks:
  refreshInterval: 5m
  fetchTimeout: 5s
  prewarmRequired: true
concurrency:
  maxDegreeOfParallelism: 16
  perRequestTimeout: 1500ms
anonymous:
  targetAccount: ANON
  expiry: 5m
  events:
    success: anon.auth.success
    failure: anon.auth.failure
