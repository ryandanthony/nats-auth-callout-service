apiVersion: authcallout.ants.zone/v1
kind: AuthApplication
metadata:
  name: notes
  namespace: notes
  labels:
    authcallout.ants.zone/owner: dev
spec:
  targetAccount: NOTES
  issuer:
    authority: https://localhost:8082/realms/dev
    jwksCache: 5m
    validateAudience: true
    audience: [nats]
    clockSkew: 60s
    allowedAlgorithms: [RS256]
  match:
    azp: [notes-web]
  identityPropagation:
    enabled: true
  anonymousProfile:
    subscribe: [notes.public.>]
  events:
    success: notes.events.auth.success
    failure: notes.events.auth.failure
  profiles:
    - name: editor
      match: { realm_access.roles: [notes-editor] }
      grant:
        # $JS.API.* and _INBOX.> are what NATS.Net's KV client needs on top of ADR 0013's
        # $KV.* subjects (GrantBuilder only adds those) - see AppHost.Local's Note.yaml for
        # the full explanation.
        publish: [notes.dev.>, "$JS.API.STREAM.INFO.>", "$JS.API.DIRECT.GET.>"]
        subscribe: [notes.dev.>, "_INBOX.>"]
      nameClaim: preferred_username
      autoAddSessionAccess: true
