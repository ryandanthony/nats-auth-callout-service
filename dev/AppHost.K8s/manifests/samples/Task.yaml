apiVersion: authcallout.ants.zone/v1
kind: AuthApplication
metadata:
  name: tasks
  namespace: tasks
  labels:
    authcallout.ants.zone/owner: dev
spec:
  targetAccount: TASKS
  issuer:
    authority: https://localhost:8082/realms/dev
    jwksCache: 5m
    validateAudience: true
    audience: [nats]
    clockSkew: 60s
    allowedAlgorithms: [RS256]
  match:
    azp: [tasks-web]
  identityPropagation:
    enabled: true
  anonymousProfile:
    subscribe: [tasks.public.>]
  events:
    success: tasks.events.auth.success
    failure: tasks.events.auth.failure
  profiles:
    - name: worker
      match: { realm_access.roles: [tasks-worker] }
      grant:
        # Only the app's own subjects; the callout auto-adds KV reads + the JetStream wire-level
        # subjects a real KV client needs (ADR 0013 §JetStream wire-level subjects).
        publish: [tasks.dev.>]
        subscribe: [tasks.dev.>]
      nameClaim: preferred_username
      autoAddSessionAccess: true
