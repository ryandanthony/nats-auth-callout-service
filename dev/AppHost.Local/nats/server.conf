# NATS server config for AppHost.Local's auth callout (P15, doc 08 §Local development, files
# source). AddNats's own helper always injects --user/--pass args (a single global-account
# credential), which nats-server rejects outright once an `accounts {}` block is present
# ("Can not have a single user/pass and accounts") - auth_callout's own `account:` field
# requires a dedicated account for the callout's service-user connection (NATS docs: "run
# auth-svc in its own account"), so this config is applied via a plain AddContainer instead
# of AddNats (see AppHost.cs). Every key below is the dev-only throwaway from
# config/bootstrap.yaml (issuerSeed/serviceUserSeed), public halves only - never a seed.
#
# targetAccount values (NOTES, TASKS) match config/apps/{Note,Task}.yaml; ANON matches
# bootstrap.yaml's anonymous.targetAccount. Accounts are declared empty here because P07's
# CalloutResponder places connecting clients into them purely via the minted user JWT's
# audience claim (doc 08 §Auth callout) - nothing about routing lives in this static file.
accounts {
  AUTH: {
    # Callout's own KV writes (identity-store token/assertion buckets, ADR 0013) go through
    # this connection, so JetStream must be opted in here too.
    jetstream: enabled
    # The callout's own service-user connection (serviceUserSeed in bootstrap.yaml).
    # Public NKey only, derived with `nats auth nkey show` - see dev/README.md.
    users: [ { nkey: UBSMQROM3HYWT3NULVSSGNQGIVUYCGDVTOKZYIYTQSPVGAHKMF4D3IWY } ]
  }
  # Once an `accounts {}` block exists, `-js` alone is not enough - JetStream is opt-in per
  # account (NATS docs: "declaring an accounts block makes JetStream opt-in per account").
  # Every account KvIdentityStoreWriter writes buckets into (targetAccount, ADR 0013) needs it.
  NOTES: { jetstream: enabled }
  TASKS: { jetstream: enabled }
  ANON: { jetstream: enabled }
}

authorization {
  auth_callout {
    # Public half of issuerSeed (config/bootstrap.yaml). The server only admits a callout
    # response signed by this key.
    issuer: "AA7YGMNUDH3477U77LWTBMYZXKWN2FWLZ5AWAAATYZZNTYC2QZEN6KZA"
    # Isolates $SYS.REQ.USER.AUTH traffic to the callout's own account (NATS docs: "why the
    # auth service runs in its own account") - nothing in NOTES/TASKS/ANON can subscribe to it.
    account: AUTH
    # The callout's service-user NKey bypasses the callout itself (it IS the callout).
    auth_users: [ "UBSMQROM3HYWT3NULVSSGNQGIVUYCGDVTOKZYIYTQSPVGAHKMF4D3IWY" ]
  }
}
