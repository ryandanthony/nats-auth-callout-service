schemaVersion: 1
name: tasks
targetAccount: TASKS
issuer:
  authority: https://localhost:8083/realms/dev
  jwksCache: 5m
  validateAudience: true
  audience: [nats]
  clockSkew: 60s
  allowedAlgorithms: [RS256]
match:
  azp: [tasks-web]
identityPropagation:
  enabled: true
anonymousProfile:
  subscribe: [tasks.public.>]
events:
  success: tasks.events.auth.success
  failure: tasks.events.auth.failure
profiles:
  - name: worker
    match:
      realm_access.roles: [tasks-worker]
    grant:
      # The Wolverine sample uses tasks.commands / tasks.queries / tasks.events plus
      # Wolverine's fixed reply subject `wolverine.response`; the callout auto-adds KV reads +
      # the JetStream wire-level subjects a real KV client needs (see Note.yaml / ADR 0013
      # §JetStream wire-level subjects). tasks.> keeps every domain subject in-grant;
      # wolverine.response is scoped to the TASKS account so it never crosses app boundaries.
      publish: [tasks.>, wolverine.response]
      subscribe: [tasks.>, wolverine.response]
    nameClaim: preferred_username
    autoAddSessionAccess: true
