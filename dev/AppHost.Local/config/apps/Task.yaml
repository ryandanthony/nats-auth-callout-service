schemaVersion: 1
name: tasks
targetAccount: TASKS
issuer:
  authority: https://localhost:8081/realms/dev
  jwksCache: 5m
  validateAudience: true
  audience: [nats]
  clockSkew: 60s
  allowedAlgorithms: [RS256]
match:
  azp: [tasks-web]
identityPropagation:
  enabled: true
anonymousProfile:
  subscribe: [tasks.public.>]
events:
  success: tasks.events.auth.success
  failure: tasks.events.auth.failure
profiles:
  - name: worker
    match:
      realm_access.roles: [tasks-worker]
    grant:
      # See Note.yaml's identical comment: $JS.API.* and _INBOX.> are what NATS.Net's KV
      # client itself needs on top of ADR 0013's $KV.* subjects, not part of that contract.
      publish: [tasks.dev.>, "$JS.API.STREAM.INFO.>", "$JS.API.DIRECT.GET.>"]
      subscribe: [tasks.dev.>, "_INBOX.>"]
    nameClaim: preferred_username
    autoAddSessionAccess: true
