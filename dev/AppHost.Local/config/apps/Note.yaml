schemaVersion: 1
name: notes
targetAccount: NOTES
issuer:
  authority: https://localhost:8081/realms/dev
  jwksCache: 5m
  validateAudience: true
  audience: [nats]
  clockSkew: 60s
  allowedAlgorithms: [RS256]
match:
  azp: [notes-web]
identityPropagation:
  enabled: true
anonymousProfile:
  subscribe: [notes.public.>]
events:
  success: notes.events.auth.success
  failure: notes.events.auth.failure
profiles:
  - name: editor
    match:
      realm_access.roles: [notes-editor]
    grant:
      # Only the app's own subjects are configured. The callout auto-adds the KV read grants
      # (keys/discovery/token/assertion $KV.* reads) AND the JetStream wire-level subjects a
      # real KV client needs ($JS.API.STREAM.INFO/DIRECT.GET per bucket + _INBOX.> reply path),
      # so identity-propagation reads work without any KV plumbing in app config (ADR 0013).
      publish: [notes.dev.>]
      subscribe: [notes.dev.>]
    nameClaim: preferred_username
    autoAddSessionAccess: true
