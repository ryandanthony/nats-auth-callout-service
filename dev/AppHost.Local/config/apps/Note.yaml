schemaVersion: 1
name: notes
targetAccount: NOTES
issuer:
  authority: https://localhost:8081/realms/dev
  jwksCache: 5m
  validateAudience: true
  audience: [nats]
  clockSkew: 60s
  allowedAlgorithms: [RS256]
match:
  azp: [notes-web]
identityPropagation:
  enabled: true
anonymousProfile:
  subscribe: [notes.public.>]
events:
  success: notes.events.auth.success
  failure: notes.events.auth.failure
profiles:
  - name: editor
    match:
      realm_access.roles: [notes-editor]
    grant:
      # notes.dev.> is the demo subject. The $JS.API.STREAM.INFO/$JS.API.DIRECT.GET and
      # _INBOX.> entries are NOT part of ADR 0013's KV grant contract (GrantBuilder only
      # adds the $KV.<bucket>.<key> subjects for keys/discovery/token reads) - they're what
      # NATS.Net's KV client (NatsKVContext.GetStoreAsync/GetEntryAsync, used by
      # CalloutDiscovery/CalloutSelfAssertion below) itself needs under the hood to look up
      # a bucket's backing stream and receive the reply, on top of the $KV.* subjects. Added
      # here per-profile since GrantBuilder doesn't add them automatically (flagged to the
      # coordinator; may move into GrantBuilder later).
      publish: [notes.dev.>, "$JS.API.STREAM.INFO.>", "$JS.API.DIRECT.GET.>"]
      subscribe: [notes.dev.>, "_INBOX.>"]
    nameClaim: preferred_username
    autoAddSessionAccess: true
